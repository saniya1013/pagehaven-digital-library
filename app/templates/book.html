<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Read this book on PageHaven — your personal digital library.">
  <title>Book Detail — PageHaven</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/logo.png" type="image/png">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar-detail">
    <div class="container">
      <a href="/home" class="logo"><img src="/static/logo.png" alt="PageHaven" class="logo-icon"> PageHaven</a>
      <button class="mobile-menu-toggle" onclick="this.nextElementSibling.classList.toggle('open')" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <div class="profile-dropdown" onclick="document.getElementById('user-dropdown').classList.toggle('show')">
          <span class="user-name-nav" id="nav-user-name">User</span>
          <div class="profile-avatar" id="nav-user-avatar"></div>
          <div class="dropdown-menu" id="user-dropdown">
            <a href="/profile" class="dropdown-item">👤 View Profile</a>
            <a href="/profile" class="dropdown-item">✏️ Edit Profile</a>
            <div class="dropdown-divider"></div>
            <a href="#" onclick="logout()" class="dropdown-item" style="color: #ef4444;">🚪 Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <script>
    if (!localStorage.getItem('access_token')) {
      window.location.href = '/auth';
    }

    async function initNavbar() {
        const token = localStorage.getItem('access_token');
        const res = await fetch('/user/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const user = await res.json();
            document.getElementById('nav-user-name').textContent = user.name.split(' ')[0];
            const avatar = document.getElementById('nav-user-avatar');
            if (user.profile_pic) {
                avatar.innerHTML = `<img src="${user.profile_pic}" alt="">`;
            } else {
                const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase();
                avatar.innerHTML = `<span class="avatar-initials">${initials}</span>`;
            }
        }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/auth';
    }

    window.onclick = function(event) {
        if (!event.target.closest('.profile-dropdown')) {
            const dropdowns = document.getElementsByClassName("dropdown-menu");
            for (let i = 0; i < dropdowns.length; i++) {
                dropdowns[i].classList.remove('show');
            }
        }
    }
    initNavbar();
  </script>

  <main class="detail-page container page-enter">
    <!-- Back Button -->
    <button class="back-btn" id="back-btn" onclick="window.history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Library
    </button>

    <!-- Loading State -->
    <div id="detail-loading" class="loading-state">
      <div class="spinner"></div>
      <p>Loading book details...</p>
    </div>

    <!-- Error State -->
    <div id="detail-error" class="empty-state" style="display:none;">
      <div class="icon">😕</div>
      <h3>Book not found</h3>
      <p>Sorry, we couldn't find the book you're looking for.</p>
      <a href="/home" class="btn btn-primary" style="margin-top:20px;">Browse Library</a>
    </div>

    <!-- Book Detail Content -->
    <div id="detail-content" class="detail-layout" style="display:none;">
      <div class="detail-cover">
        <img id="detail-cover-img" src="" alt="Book Cover">
      </div>
      <div class="detail-info">
        <div class="category-tags" id="detail-categories"></div>
        <h1 id="detail-title"></h1>
        <p class="author-name" id="detail-author"></p>
        <div class="rating-display">
          <span class="stars" id="detail-stars"></span>
          <span class="score" id="detail-score"></span>
        </div>
        <p class="description" id="detail-description"></p>
        <div class="detail-actions">
          <a id="detail-read-btn" href="#" target="_blank" class="btn btn-primary">
            📖 Read Book
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
          </a>
          <button class="btn btn-secondary" onclick="window.history.back()">← Back</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Book Detail Page Logic
    (function() {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('id');

      const loadingEl = document.getElementById('detail-loading');
      const errorEl   = document.getElementById('detail-error');
      const contentEl = document.getElementById('detail-content');

      if (!bookId) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        return;
      }

      fetch(`/book/${bookId}`)
        .then(res => res.json())
        .then(book => {
          loadingEl.style.display = 'none';

          if (book.error) {
            errorEl.style.display = 'block';
            return;
          }

          // Populate content
          document.getElementById('detail-cover-img').src = book.cover || '';
          document.getElementById('detail-cover-img').alt = book.title;
          document.getElementById('detail-title').textContent = book.title;
          document.getElementById('detail-author').textContent = `by ${book.author}`;
          document.title = `${book.title} — PageHaven`;

          // Rating stars
          const rating = book.rating || 0;
          const fullStars = Math.floor(rating);
          const halfStar = rating % 1 >= 0.5 ? 1 : 0;
          const emptyStars = 5 - fullStars - halfStar;
          document.getElementById('detail-stars').textContent =
            '★'.repeat(fullStars) + (halfStar ? '☆' : '') + '☆'.repeat(emptyStars);
          document.getElementById('detail-score').textContent = rating.toFixed(1);

          // Description
          document.getElementById('detail-description').textContent =
            book.description || 'No description available for this book.';

          // Categories
          const catContainer = document.getElementById('detail-categories');
          (book.category || []).forEach(cat => {
            const tag = document.createElement('span');
            tag.className = 'category-tag';
            tag.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
            catContainer.appendChild(tag);
          });

          // Read button
          if (book.pdf_url) {
            document.getElementById('detail-read-btn').href = `/read?id=${bookId}`;
            document.getElementById('detail-read-btn').removeAttribute('target');
          } else {
            document.getElementById('detail-read-btn').style.display = 'none';
          }

          contentEl.style.display = 'grid';
          loadRecommendations(bookId);
        })
        .catch(err => {
          console.error('Error loading book:', err);
          loadingEl.style.display = 'none';
          errorEl.style.display = 'block';
        });

      function loadRecommendations(id) {
        const recSection = document.getElementById('recommendations-section');
        const recContainer = document.getElementById('recommendations-container');
        
        fetch(`/recommend/${id}`)
          .then(res => res.json())
          .then(books => {
            if (books && books.length > 0) {
              recSection.style.display = 'block';
              recContainer.innerHTML = books.map(book => `
                <div class="book-card" onclick="window.location.href='/book?id=${book._id}'">
                  <div class="cover-wrap">
                    <img src="${book.cover || ''}" alt="${book.title}" loading="lazy">
                    <div class="cover-overlay">
                      <div class="card-badge">Similar</div>
                    </div>
                  </div>
                  <div class="card-body">
                    <h3>${book.title}</h3>
                    <p class="author">${book.author}</p>
                    <div class="rating">
                      <span class="stars">${'★'.repeat(Math.floor(book.rating || 0))}${(book.rating % 1 >= 0.5) ? '☆' : ''}</span>
                      <span class="score">${(book.rating || 0).toFixed(1)}</span>
                    </div>
                  </div>
                </div>
              `).join('');
            }
          })
          .catch(err => console.error('Error loading recommendations:', err));
      }
    })();
  </script>
  
  <style>
    .recommendations { margin-top: 80px; padding-top: 40px; border-top: 1px solid var(--border); }
    .recommendations h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 32px; }
    #recommendations-container { margin-bottom: 60px; }
  </style>
  
  <!-- Recommendations Section -->
  <div id="recommendations-section" class="recommendations container" style="display:none;">
    <h2>✨ More Like This</h2>
    <div id="recommendations-container" class="books-grid"></div>
  </div>

</body>
</html>
