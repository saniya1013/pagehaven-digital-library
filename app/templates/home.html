<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse the PageHaven library — discover free public-domain classics.">
  <title>Library — PageHaven</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/logo.png" type="image/png">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar-dashboard">
    <div class="container">
      <a href="/home" class="logo"><img src="/static/logo.png" alt="PageHaven" class="logo-icon"> PageHaven</a>
      
      <div class="profile-dropdown" onclick="document.getElementById('user-dropdown').classList.toggle('show')">
        <span class="user-name-nav" id="nav-user-name">User</span>
        <div class="profile-avatar" id="nav-user-avatar"></div>
        <div class="dropdown-menu" id="user-dropdown">
          <a href="/profile" class="dropdown-item">👤 View Profile</a>
          <a href="/profile" class="dropdown-item">✏️ Edit Profile</a>
          <div class="dropdown-divider"></div>
          <a href="#" onclick="logout()" class="dropdown-item" style="color: #ef4444;">🚪 Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <script>
    if (!localStorage.getItem('access_token')) {
      window.location.href = '/auth';
    }

    async function initNavbar() {
        const token = localStorage.getItem('access_token');
        const res = await fetch('/user/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const user = await res.json();
            document.getElementById('nav-user-name').textContent = user.name.split(' ')[0];
            const avatar = document.getElementById('nav-user-avatar');
            if (user.profile_pic) {
                avatar.innerHTML = `<img src="${user.profile_pic}" alt="">`;
            } else {
                const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase();
                avatar.innerHTML = `<span class="avatar-initials">${initials}</span>`;
            }
            loadHistory(user._id);
        }
    }

    async function loadHistory(userId) {
        try {
            const res = await fetch(`/reading-history/${userId}`);
            if (res.ok) {
                const history = await res.json();
                if (history.length > 0) {
                    const section = document.getElementById('history-section');
                    const container = document.getElementById('history-container');
                    section.style.display = 'block';
                    container.innerHTML = history.map(item => `
                        <div class="history-card" onclick="window.location.href='/read?id=${item.book_id}'">
                            <div class="h-cover">
                                <img src="${item.cover || 'https://via.placeholder.com/150x200?text=No+Cover'}" alt="">
                            </div>
                            <div class="h-info">
                                <h3>${item.book_title}</h3>
                                <p>${item.book_author}</p>
                                <button class="resume-btn">Resume</button>
                            </div>
                        </div>
                    `).join('');
                }
            }
        } catch (e) { console.error("History Load Error:", e); }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/auth';
    }

    window.onclick = function(event) {
        if (!event.target.closest('.profile-dropdown')) {
            const dropdowns = document.getElementsByClassName("dropdown-menu");
            for (let i = 0; i < dropdowns.length; i++) {
                dropdowns[i].classList.remove('show');
            }
        }
    }
    initNavbar();
  </script>

  <main class="dashboard container page-enter">
    <div class="dashboard-header">
      <h1>📚 Explore the Library</h1>
      <p>Discover timeless classics from the world's greatest authors</p>
    </div>

    <!-- Continue Reading Section -->
    <div id="history-section" style="display: none; margin-bottom: 50px;">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 20px;">🕒 Continue Reading</h2>
        <div id="history-container" class="history-grid"></div>
    </div>

    <!-- Search -->
    <div class="search-bar" style="position: relative;">
      <input type="text" id="search-input" placeholder="🔍  Search by title, author, or category..." autocomplete="off">
      <div id="search-suggestions" class="search-suggestions"></div>
    </div>

    <!-- Category Filters -->
    <div class="filter-chips" id="filter-chips">
      <button class="chip active" data-category="all">All</button>
    </div>

    <!-- Book Grid -->
    <div id="books-container" class="books-grid"></div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
