<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading — PageHaven</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: #1a1a1a;
        }
        .reader-container {
            display: flex; flex-direction: column; height: 100vh;
        }
        .reader-header {
            height: 70px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 32px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .reader-header .logo { 
            display: flex; align-items: center; gap: 12px;
            font-size: 1.1rem; font-weight: 800; color: var(--primary);
            text-decoration: none;
        }
        .reader-header .logo img { width: 28px; height: 28px; }
        
        .reader-header .book-title {
            font-family: 'Playfair Display', serif;
            font-weight: 800; font-size: 1.2rem; color: var(--text);
            text-align: center;
            max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .reader-header .actions {
            display: flex; justify-content: flex-end;
        }
        .close-reader-btn {
            background: #fff; border: 1px solid var(--border);
            padding: 8px 18px; border-radius: 12px; font-weight: 600;
            color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
        }
        .close-reader-btn:hover {
            border-color: #ef4444; color: #ef4444;
            background: #fef2f2; transform: translateY(-1px);
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .reader-header {
                height: 60px;
                padding: 0 16px;
                grid-template-columns: auto 1fr auto;
                gap: 12px;
            }
            .reader-header .logo span { display: none; }
            .reader-header .book-title {
                font-size: 0.95rem;
                max-width: 100%;
            }
            .close-reader-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            .close-reader-btn span:last-child { display: none; } /* Hide "Close Reader" text, keep icon */
        }
        .reader-frame-container {
            flex-grow: 1; position: relative; background: white;
        }
        iframe {
            width: 100%; height: 100%; border: none;
        }
        .loading-overlay {
            position: absolute; inset: 0; background: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="reader-container">
        <header class="reader-header">
            <a href="/home" class="logo">
                <img src="/static/logo.png" alt="Logo">
                <span>PageHaven</span>
            </a>
            <div class="book-title" id="book-title">Loading book...</div>
            <div class="actions">
                <button class="close-reader-btn" onclick="window.close(); if(window.history.length > 1) window.history.back(); else window.location.href='/home'">
                    <span>✕</span> <span>Close Reader</span>
                </button>
            </div>
        </header>
        
        <div class="reader-frame-container">
            <div id="loader" class="loading-overlay">
                <div class="spinner"></div>
                <p>Opening your book...</p>
            </div>
            <iframe id="reader-iframe" src="" onload="document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none', 500)"></iframe>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const bookId = params.get('id');

        if (bookId) {
            fetch(`/book/${bookId}`)
                .then(res => res.json())
                .then(book => {
                    if (book.pdf_url) {
                        document.getElementById('book-title').textContent = book.title;
                        document.title = `Reading: ${book.title} — PageHaven`;
                        document.getElementById('reader-iframe').src = book.pdf_url;
                    } else {
                        alert("Book URL not found.");
                        window.history.back();
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Error loading book reader.");
                });
        } else {
            window.location.href = '/home';
        }
    </script>
</body>
</html>
