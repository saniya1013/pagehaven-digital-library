<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading — PageHaven</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: #1a1a1a;
        }
        .reader-container {
            display: flex; flex-direction: column; height: 100vh;
        }
        .reader-header {
            height: 70px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 32px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .reader-header .logo { 
            display: flex; align-items: center; gap: 12px;
            font-size: 1.1rem; font-weight: 800; color: var(--primary);
            text-decoration: none;
        }
        .reader-header .logo img { width: 28px; height: 28px; }
        
        .reader-header .book-title {
            font-family: 'Playfair Display', serif;
            font-weight: 800; font-size: 1.2rem; color: var(--text);
            text-align: center;
            max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .reader-header .actions {
            display: flex; justify-content: flex-end;
        }
        .close-reader-btn {
            background: #fff; border: 1px solid var(--border);
            padding: 8px 18px; border-radius: 12px; font-weight: 600;
            color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
        }
        .close-reader-btn:hover {
            border-color: #ef4444; color: #ef4444;
            background: #fef2f2; transform: translateY(-1px);
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .reader-header {
                height: 60px;
                padding: 0 16px;
                grid-template-columns: auto 1fr auto;
                gap: 12px;
            }
            .reader-header .logo span { display: none; }
            .reader-header .book-title {
                font-size: 0.95rem;
                max-width: 100%;
            }
            .close-reader-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            .close-reader-btn span:last-child { display: none; } /* Hide "Close Reader" text, keep icon */
        }
        .reader-frame-container {
            flex-grow: 1; position: relative; background: white;
        }
        iframe {
            width: 100%; height: 100%; border: none;
        }
        .loading-overlay {
            position: absolute; inset: 0; background: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* AI Assistant Styles */
        .ai-assistant-toggle {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--gradient); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; z-index: 200;
            box-shadow: var(--shadow-lg); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: none; outline: none;
        }
        .ai-assistant-toggle:hover { transform: scale(1.1) rotate(5deg); }
        .ai-assistant-toggle:active { transform: scale(0.9); }

        .ai-panel {
            position: fixed; top: 0; right: -400px; width: 400px; height: 100vh;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-left: 1px solid var(--border); z-index: 1000;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
        }
        .ai-panel.open { right: 0; }
        
        .ai-header {
            padding: 20px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            background: white; position: sticky; top: 0; z-index: 10;
        }
        .ai-header h2 { 
            font-family: 'Playfair Display', serif; font-size: 1.2rem; margin: 0;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .close-ai { font-size: 1.8rem; cursor: pointer; color: var(--text-secondary); padding: 5px; }

        .ai-chat-area { 
            flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
            background: #fafafa;
        }
        .chat-bubble { padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; max-width: 85%; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .chat-bubble.user { background: var(--gradient); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-bubble.ai { background: white; color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        
        .ai-actions { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; background: white; overflow-x: auto; }
        .ai-input-wrap { 
            padding: 15px 20px; background: white; border-top: 1px solid var(--border); 
            display: flex; gap: 10px; align-items: center;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }
        .ai-input { 
            flex-grow: 1; padding: 12px 18px; border: 1.5px solid var(--border); border-radius: 25px;
            outline: none; font-size: 1rem; transition: all 0.3s; background: #f8fafc;
        }
        .ai-input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        .send-ai-btn { 
            width: 48px; height: 48px; border-radius: 50%; background: var(--primary); 
            color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
            flex-shrink: 0; font-size: 1.2rem;
        }
        .ai-quick-btn { 
            white-space: nowrap; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            background: #f1f5f9; color: var(--text); cursor: pointer; border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .ai-quick-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        @media (max-width: 768px) {
            .ai-panel { 
                width: 100% !important; 
                right: -100%; 
                height: 100%;
                border-left: none;
            }
            .ai-assistant-toggle { 
                bottom: 25px; right: 25px; width: 55px; height: 55px; 
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }
            .ai-header { padding: 15px 20px; }
            .ai-chat-area { padding: 15px; }
            .chat-bubble { max-width: 90%; font-size: 0.9rem; }
            .ai-actions { padding: 10px 15px; }
            .ai-input-wrap { padding: 10px 15px; padding-bottom: max(15px, env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
    <div class="reader-container">
        <header class="reader-header">
            <a href="/home" class="logo">
                <img src="/static/logo.png" alt="Logo">
                <span>PageHaven</span>
            </a>
            <div class="book-title" id="book-title">Loading book...</div>
            <div class="actions">
                <button class="close-reader-btn" onclick="window.close(); if(window.history.length > 1) window.history.back(); else window.location.href='/home'">
                    <span>✕</span> <span>Close Reader</span>
                </button>
            </div>
        </header>
        
        <div class="reader-frame-container">
            <div id="loader" class="loading-overlay">
                <div class="spinner"></div>
                <p>Opening your book...</p>
            </div>
            <iframe id="reader-iframe" src="" onload="document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none', 500)"></iframe>
        </div>
    </div>

    <button class="ai-assistant-toggle" id="ai-toggle" title="AI Assistant">✨</button>

    <div class="ai-panel" id="ai-panel">
        <div class="ai-header">
            <h2>✨ AI Assistant</h2>
            <span class="close-ai" id="close-ai">✕</span>
        </div>
        <div class="ai-chat-area" id="ai-chat-history">
            <div class="chat-bubble ai">Hello! I'm your AI Reading Assistant. I can summarize this book for you or answer any questions you have.</div>
        </div>
        <div class="ai-actions">
            <button class="ai-quick-btn" onclick="generateSummary()">📋 Summarize Book</button>
            <button class="ai-quick-btn" onclick="quickExplain()">💡 Key Concepts</button>
        </div>
        <div class="ai-input-wrap">
            <input type="text" class="ai-input" id="ai-user-input" placeholder="Ask about this book...">
            <button class="send-ai-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const bookId = params.get('id');
        const token = localStorage.getItem('access_token');

        // Book Loading Logic
        if (bookId) {
            fetch(`/book/${bookId}`, {
                headers: token ? { 'Authorization': `Bearer ${token}` } : {}
            })
                .then(res => {
                    if (!res.ok) throw new Error("Failed to fetch book details");
                    return res.json();
                })
                .then(book => {
                    if (book && book.pdf_url) {
                        document.getElementById('book-title').textContent = book.title;
                        document.title = `Reading: ${book.title} — PageHaven`;
                        
                        let finalUrl = book.pdf_url;
                        if (finalUrl.includes('gutenberg.org/ebooks/')) {
                            const bookIdMatch = finalUrl.match(/\/ebooks\/(\d+)/);
                            if (bookIdMatch) {
                                const id = bookIdMatch[1];
                                finalUrl = `https://www.gutenberg.org/files/${id}/${id}-h/${id}-h.htm`;
                            }
                        }
                        document.getElementById('reader-iframe').src = finalUrl;
                    } else {
                        throw new Error("Book URL not found.");
                    }
                })
                .catch(err => {
                    console.error('Reader Error:', err);
                    document.getElementById('book-title').textContent = "Error Loading Book";
                    alert("Sorry, we couldn't open this book. Please try again later.");
                    window.location.href = '/home';
                });
        } else {
            window.location.href = '/home';
        }

        // AI Assistant Logic
        const aiToggle = document.getElementById('ai-toggle');
        const aiPanel = document.getElementById('ai-panel');
        const closeAi = document.getElementById('close-ai');
        const aiInput = document.getElementById('ai-user-input');
        const chatHistory = document.getElementById('ai-chat-history');

        aiToggle.onclick = () => aiPanel.classList.toggle('open');
        closeAi.onclick = () => aiPanel.classList.remove('open');

        function appendMessage(text, role) {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${role}`;
            bubble.textContent = text;
            chatHistory.appendChild(bubble);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const msg = aiInput.value.trim();
            if (!msg) return;

            appendMessage(msg, 'user');
            aiInput.value = '';

            try {
                const response = await fetch('/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_id: bookId, message: msg })
                });
                const data = await response.json();
                if (data.response) {
                    appendMessage(data.response, 'ai');
                } else if (data.detail) {
                    appendMessage(`AI Error: ${data.detail}`, 'ai');
                } else {
                    appendMessage("Sorry, I'm having trouble connecting to my brain right now.", 'ai');
                }
            } catch (err) {
                appendMessage(`Error: ${err.message}`, 'ai');
            }
        }

        async function generateSummary() {
            appendMessage("Please summarize this book for me.", 'user');
            try {
                const response = await fetch('/ai/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_id: bookId })
                });
                const data = await response.json();
                if (data.summary) {
                    appendMessage(data.summary, 'ai');
                } else if (data.detail) {
                    appendMessage(`AI Error: ${data.detail}`, 'ai');
                } else {
                    appendMessage("I couldn't generate a summary. Check if the book is available.", 'ai');
                }
            } catch (err) {
                appendMessage(`Error: ${err.message}`, 'ai');
            }
        }

        function quickExplain() {
            aiInput.value = "Explain the key concepts of this book simply.";
            sendMessage();
        }

        aiInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
